# Exists so Supabase Branching can create a preview database for every pull
# request. Branching needs a supabase/ directory in the repository.
#
# Keep this file minimal. A preview branch starts from a copy of the
# production project's settings and only the settings here are applied on
# top, so anything added here changes every preview branch.
#
# supabase/migrations/ stays empty on purpose: Prisma owns the schema. The
# backend's Vercel build (backend/scripts/vercel-build.sh) runs
# `prisma migrate deploy` and the seed against the branch database.
project_id = "redicycle"

[db.seed]
# Seeding is done by Prisma (backend/prisma/seed.ts), not by a seed.sql.
enabled = false
