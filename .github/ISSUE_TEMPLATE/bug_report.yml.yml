name: Bug report
description: Something is broken or not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check the existing issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short, clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the bug happen?
      options:
        - Frontend
        - Backend
        - API wiring
        - Storybook
        - Infra
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: blocking
    attributes:
      label: Is this blocking you?
      options:
        - label: Yes, I can't continue my work until this is fixed

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: Paste screenshots or console errors here (optional).