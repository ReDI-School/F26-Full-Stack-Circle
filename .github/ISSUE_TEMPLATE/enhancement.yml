name: ✨ Enhancement
description: Suggest a new feature or an improvement
title: "[Enhancement]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please check the existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need first, not the solution.
      placeholder: "As a [user], I want [something], so that [goal]."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think we could do it?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is this about?
      options:
        - Frontend
        - Backend
        - API wiring
        - Storybook
        - Infra
        - Documentation
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: first-issue
    attributes:
      label: Good first issue?
      options:
        - label: This could be a good task for a beginner