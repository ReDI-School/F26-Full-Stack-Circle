name: CI

on:
  pull_request:
  push:
    branches: [main]

# If you push again while CI is still running, cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Build
        run: pnpm --filter frontend build

      - name: Build Storybook
        run: pnpm --filter frontend build-storybook

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL for the duration of the job, so the
    # migrations and the seed are tested for real.
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: redi
          POSTGRES_PASSWORD: redi
          POSTGRES_DB: redicycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U redi -d redicycle"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://redi:redi@localhost:5432/redicycle

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter backend lint

      - name: Typecheck
        run: pnpm --filter backend typecheck

      - name: Build
        run: pnpm --filter backend build

      - name: Apply the schema to the database
        run: pnpm --filter backend db:push

      - name: Run the seed
        run: pnpm --filter backend db:seed

  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check
