packages:
  - frontend
  - backend

# pnpm does not run a dependency's install scripts unless it is allowed
# here. Prisma needs its own to download the query engine, and the others
# build native binaries.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
